<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VulnUnify — Sign in</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="login">
  <div class="login-card">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 7.9 7.5 9.4 4.3-1.5 7.5-4.8 7.5-9.4v-6L12 2.5Z" fill="currentColor" opacity=".9"/><path d="m8.6 12 2.3 2.3 4.5-4.6" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="name" style="font-size:16px;font-weight:700">VulnUnify</span>
    </div>
    <h1>Sign in</h1>
    <form id="loginForm">
      <input id="u" placeholder="Username" autocomplete="username" autofocus />
      <input id="p" type="password" placeholder="Password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
      <div id="err" class="err-msg"></div>
    </form>
    <div id="sso" hidden>
      <div class="sso-divider"><span>or</span></div>
      <a id="ssoBtn" class="sso-btn" href="#">Single sign-on</a>
    </div>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    const nextParam = qs.get("next");

    if (qs.get("sso_error")) {
      document.getElementById("err").textContent = "SSO sign-in failed. Try again or use a password.";
    }

    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("err"); err.textContent = "";
      const res = await fetch("/api/auth/login", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u.value, password: p.value }),
      });
      if (res.ok) {
        location.href = nextParam || "/";
      } else {
        err.textContent = "Invalid username or password";
      }
    };

    // Offer SSO only when the server says it's configured.
    (async () => {
      try {
        const p = await (await fetch("/api/auth/providers")).json();
        if (p.oidc && p.oidc.enabled) {
          const btn = document.getElementById("ssoBtn");
          btn.textContent = p.oidc.label || "Single sign-on";
          btn.href = "/api/auth/oidc/login" + (nextParam ? "?next=" + encodeURIComponent(nextParam) : "");
          document.getElementById("sso").hidden = false;
        }
      } catch { /* providers unreachable: local login still works */ }
    })();
  </script>
</body>
</html>
